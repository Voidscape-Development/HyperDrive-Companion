name: Unit Tests
on:
  workflow_call:
jobs:
  core-tests:
    name: Core unit tests 🧪
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run 🧪
        run: |
          : Build and run 🧪
          cmake -S tests -B build_tests -DCMAKE_BUILD_TYPE=Debug
          cmake --build build_tests
          ctest --test-dir build_tests --output-on-failure
